name: cover-image-workflow
version: 1.0.0
description: Generate uMaxDATA and SIP branded article cover images in multiple social media sizes.
inputs:
  required:
    - title
    - topic
  optional:
    - summary
    - language
    - output_formats
    - brand_assets
defaults:
  language: zh-Hant
  locale: Hong Kong
  title_color: "#004f5d"
  background_color: "#dceff2"
  layout_reference_mode: strict
  generation_resolution: 4K
  export_formats:
    - png
    - webp
  candidate_16x9_covers: 3
  selected_cover_sets_for_social: 1
  formats:
    - name: 16x9
      width: 1280
      height: 720
      usage: website cover
    - name: 1x1
      width: 1080
      height: 1080
      usage: square social post
    - name: 4x5
      width: 1080
      height: 1350
      usage: vertical feed post
    - name: 9x16
      width: 1080
      height: 1920
      usage: story reel short
assets:
  reference_cover: /workspace/af9bb15e-1e58-4380-a480-87afbf6f51be.png
  reference_cover_url: https://files.umaxdata.com/af9bb15e-1e58-4380-a480-87afbf6f51be.PNG
  reference_layout_prompt: strict 16x9 layout with left light blue-gray brand/title area occupying 52%-55%, right topic visual area occupying 45%-48%, diagonal translucent glass transition, uMaxDATA and SIP logos at upper-left, bold #004f5d Traditional Chinese title below logos
  umaxdata_logo: /workspace/源大-uMaxData-2025-彩.png
  sip_logo: /workspace/SIP-c (3).png
  umaxdata_logo_url: https://cms.ersinfotech.com/ersinfotech/wp-content/uploads/sites/11/2025/06/2024-hk-uMaxdata-LOGO-png.png
  sip_logo_url: https://cms.ersinfotech.com/ersinfotech/wp-content/uploads/sites/11/2025/07/SIP.png
steps:
  - id: validate_inputs
    action: confirm title and topic are available
  - id: analyze_title
    action: analyze Hong Kong Traditional Chinese title semantics, decide main title line breaks, font size, and optional subtitle hierarchy
  - id: validate_font_support
    action: optional fallback only; verify available CJK font if post-composition is needed to fix failed generated text
  - id: prepare_negative_prompt
    action: apply forbidden content rules for sensitive imagery, recognizable portraits, sensitive buildings, fake text, simplified Chinese, and corrupted logos
  - id: generate_three_16x9_candidates
    action: call image_generation three times to directly generate complete 16x9 branded covers with logo, title, layout, and distinct title-related visuals
  - id: ask_user_to_select_16x9_cover
    action: ask "請選擇基於 Set 01 / Set 02 / Set 03 哪個版本生成 1:1、4:5、9:16 社媒尺寸；或提出修改方案 / 重新生成。"
  - id: generate_social_sizes_from_selected_cover
    action: create 1x1, 4x5, and 9x16 branded covers only for the selected 16x9 cover set
  - id: verify_outputs
    action: check count, dimensions, title accuracy, logo integrity, and visual consistency
  - id: deliver
    action: submit all final PNG files to the user
outputs:
  phase_1_count: 6
  phase_1_naming_pattern: cover_candidate_set_{set}_16x9.{png|webp}
  phase_2_count: 6
  phase_2_naming_pattern: cover_selected_set_{set}_{format}.{png|webp}
quality_checks:
  - exact output dimensions
  - no non-proportional resizing; output processing must preserve aspect ratio and must not squash or stretch text, logos, or visuals
  - 16x9 layout matches reference left-right ratio and diagonal divider position
  - title is semantically segmented into a small number of readable lines
  - title font size is appropriate for title length
  - subtitle, if present, is smaller and non-bold
  - all generated images use 4K generation where supported
  - PNG and WebP versions are exported
  - logos are complete, readable, uncropped, undistorted, and contain no broken text or missing words
  - logos retain original aspect ratio and are not horizontally squashed or vertically stretched
  - uMaxDATA and SIP logos have equal visual height, vertical center alignment, and balanced brand weight like the reference cover
  - all visible text is Traditional Chinese for Hong Kong context except official brand names
  - title and subtitle generated by image model are complete, accurate, readable, and Traditional Chinese
  - Chinese title strokes are sharp, edges are crisp, color is vivid, and text is absolutely readable with no blur, distortion, wrong characters, or gibberish
  - no tofu boxes, missing glyphs, corrupted characters, question marks, or gibberish in typography
  - font supports Hong Kong Cantonese characters such as 喺, 嘅, 點解
  - font fallback is not plain Latin Noto Sans; actual CJK TC font file is verified
  - 16x9 includes reference-like translucent diagonal glass/structure transition between text and visual
  - non-16x9 layouts are independently balanced with appropriate visual/text ratio, title line count, font size, and spacing
  - social media title font size is not oversized; semantic line breaks are natural and do not split fixed terms or proper nouns
  - no recognizable real-person portraits, sensitive buildings, sensitive imagery, fake official symbols, or unauthorized logos
  - phase 1 produces three complete 16x9 candidate covers with distinct title-related visuals
  - phase 2 uses only the selected 16x9 cover set to produce 1x1, 4x5, and 9x16 covers
  - no generated fake text inside topic visual
  - title color equals #004f5d
  - logos remain accurate and not distorted
  - consistent corporate editorial style
